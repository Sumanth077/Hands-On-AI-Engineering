[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-scout"
version = "0.1.0"
description = "Discover and compare open-source projects with cited public evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "python-dotenv>=1,<2", "streamlit>=1.40,<2", "google-genai>=2.34,<3", "openai>=2.54,<3"]

[project.scripts]
repo-scout = "repo_scout.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".uv-cache", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]


[tool.hatch.build.targets.wheel]
packages = ["src/repo_scout"]
