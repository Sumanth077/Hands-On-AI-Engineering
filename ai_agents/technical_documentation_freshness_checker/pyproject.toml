[project]
name = "technical-documentation-freshness-checker"
version = "1.0.0"
description = "Check time-sensitive claims in technical PDFs against current web evidence."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "landingai-ade>=1.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "streamlit>=1.57.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["freshness_checker"]
