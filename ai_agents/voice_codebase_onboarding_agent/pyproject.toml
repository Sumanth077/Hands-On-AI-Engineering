[project]
name = "voice-codebase-onboarding-agent"
version = "1.0.0"
description = "A voice-guided agent for exploring real GitHub and local repositories."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "langgraph>=1.0.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.57.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

