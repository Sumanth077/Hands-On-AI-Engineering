[project]
name = "nl-data-analyst-agent"
version = "1.0.0"
description = "Gradio client for an Eve and Vercel AI Gateway data analyst"
requires-python = ">=3.10"
dependencies = [
  "gradio>=5.0,<7",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "pandas>=2.2,<3",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
