[project]
name = "citation-deep-research-agent"
version = "1.0.0"
description = "Citation-aware document Q&A over long PDFs: LlamaParse for parsing, local Ollama for answers, every answer cited back to the source."
requires-python = ">=3.10"
dependencies = [
    "llama-index>=0.12.0",
    "llama-index-llms-ollama>=0.4.0",
    "llama-index-embeddings-ollama>=0.4.0",
    "llama-cloud-services>=0.6.0",
    "streamlit>=1.36.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["citation_agent"]
