name: Syntax check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fail on unresolved merge conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)( |$)' -- . ':!*.ipynb'; then
            echo "::error::Unresolved merge conflict markers found (see above)"
            exit 1
          fi

      - name: Byte-compile all Python files
        run: python -m compileall -q .
